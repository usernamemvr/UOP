version: "3.8"

services:

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  user-service:
    build: ./user-service
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  order-service:
    build: ./order-service
    ports:
      - "8082:8080"
    depends_on:
      - discovery-server
      - user-service

  payment-service:
    build: ./payment-service
    ports:
      - "8081:8080"
    depends_on:
      - discovery-server